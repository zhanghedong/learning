server {
    listen 80;
    server_name review.studynote.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://review.studynote.me$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name review.studynote.me;

    ssl_certificate      /etc/nginx/ssl/review.studynote.me/cert.pem;
    ssl_certificate_key  /etc/nginx/ssl/review.studynote.me/key.pem;

    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    root /data/webroot/review;
    index index.html;

    location /api/sync/ {
        proxy_pass http://127.0.0.1:3107/api/sync/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
